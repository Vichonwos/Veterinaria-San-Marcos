<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>🐾 Veterinaria San Marcos</h1>
        </div>
        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="index.html">Volver al Inicio</a></li>
           
            </ul>
        </nav>
    </header>

    <main class="container-form">
        <section class="form-section" style="max-width: 400px; margin: 4rem auto;">
            <h2>Acceso al Sistema</h2>
            <p>Ingresa tus credenciales seguras protegidas con token.</p>
            
            <form id="formLogin">
                <div class="campo">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" placeholder="usuario@sanmarcos.cl" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="loginPass">Contraseña:</label>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Clínica Veterinaria San Marcos.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
