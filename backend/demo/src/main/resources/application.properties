# Conexión a MySQL (crea la BD automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: crea y actualiza automáticamente las 5 tablas en la BD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave secreta para firmar los tokens JWT (mínimo 32 caracteres)
jwt.secret=ClaveSuperSecretaParaEvaluacion3DuocUC2026!
jwt.expiration=86400000